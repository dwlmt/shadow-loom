# =====================================================================
# Shadow Loom — local development stack
# =====================================================================
# Spins up Postgres + the Shadow Loom UI as containers. The host's
# Ollama (running natively for GPU access) is reached via the
# host.docker.internal alias. If you don't have Ollama, change
# DEFAULT_MODEL in .env to an openrouter:* or openai:* model and
# Postgres-only deployment still works.
#
# Required env vars (set in a sibling .env file or export in shell):
#   POSTGRES_PASSWORD   — Postgres superuser password. No default;
#                         compose will refuse to start if unset.
#   STORAGE_SECRET      — NiceGUI session cookie signing key. No
#                         default; cookies become forgeable without it.
#
# Bring up:        docker compose up --build
# Tail logs:       docker compose logs -f app
# Reset DB:        docker compose down -v   # ⚠ wipes the postgres volume
#
# Round-11 R11-11: the previous version hard-coded
# ``POSTGRES_PASSWORD=shadow_loom`` and exposed Postgres on the host's
# ``5432`` port — anyone who ``docker compose up``'d on a shared box
# (or a VPS without a firewall) was running a publicly reachable
# Postgres with a known password. We now require the password from
# the environment (no literal fallback), drop the host port mapping
# so Postgres is reachable only by the ``app`` service over the
# internal compose network, and require ``STORAGE_SECRET`` to be set
# explicitly so prod deployments cannot silently inherit a dev
# placeholder that would let an attacker forge session cookies.
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shadow_loom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or the environment}
      POSTGRES_DB: ${POSTGRES_DB:-shadow_loom}
    # No ``ports:`` mapping — Postgres is reachable only from sibling
    # services (``app``) over the internal compose network. To access
    # the DB from the host for debugging, use ``docker compose exec
    # postgres psql -U shadow_loom`` instead.
    volumes:
      - shadow_loom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadow_loom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7860:7860"
    environment:
      # Connect the app container to the postgres service.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shadow_loom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-shadow_loom}
      # Talk to a host-side Ollama daemon (Linux: needs --add-host).
      # On Docker Desktop (Mac/Windows) host.docker.internal is built in.
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1/
      STORAGE_SECRET: ${STORAGE_SECRET:?STORAGE_SECRET must be set in .env or the environment}
      UI_HOST: 0.0.0.0
      UI_PORT: 7860
      UI_SOURCE_URL: ${UI_SOURCE_URL:-https://github.com/dwlmt/shadow-loom}
      # Forward LLM provider keys from the host shell or .env (compose
      # auto-loads .env from the project root for ${VAR} interpolation).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANYSCALE_API_KEY: ${ANYSCALE_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NOVITA_API_KEY: ${NOVITA_API_KEY:-}
      HYPERBOLIC_API_KEY: ${HYPERBOLIC_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Local OpenAI-compat servers (llama.cpp / vLLM / LM Studio / LocalAI)
      # default to localhost; override the base URL when running inside Docker
      # so the container reaches the host daemon via host.docker.internal.
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-http://host.docker.internal:8080/v1}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LOCALAI_BASE_URL: ${LOCALAI_BASE_URL:-http://host.docker.internal:8080/v1}
      SHADOW_LOOM_PROVIDERS: ${SHADOW_LOOM_PROVIDERS:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-ollama:qwen3.6:35b}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      # Optional research provider (off unless explicitly enabled).
      # Forward TAVILY_API_KEY from the host if set; safe to leave blank.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXTRACTION_ENABLE_RESEARCH_AGENT: ${EXTRACTION_ENABLE_RESEARCH_AGENT:-false}
      EXTRACTION_RESEARCH_PROVIDER: ${EXTRACTION_RESEARCH_PROVIDER:-none}
    extra_hosts:
      # Linux Docker Engine doesn't auto-create host.docker.internal.
      - "host.docker.internal:host-gateway"

volumes:
  shadow_loom_pg:
